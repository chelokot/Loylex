name: loylex

x-pm3:
  loylex-gateway:
    required_services:
      - gateway
    gateway:
      health:
        check_at: always
  loylex-worker-blue:
    required_services:
      - agent-blue
    agent-blue:
      health:
        check_at: always
  loylex-worker-green:
    required_services:
      - agent-green
    agent-green:
      health:
        check_at: always

services:
  gateway:
    profiles:
      - gateway
    image: ghcr.io/chelokot/loylex-gateway@sha256:73c65b5a4592c6e0910151a2ca2ffe5320aa3dd87a94f0f7b050d713e532429b
    container_name: loylex-gateway
    networks:
      - loylex
    volumes:
      - gateway-data:/data:Z,U
      - audit-data:/audit:Z
    secrets:
      - loylex-telegram-token
      - loylex-bridge-token
    environment:
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/loylex-telegram-token
      LOYLEX_BRIDGE_TOKEN_FILE: /run/secrets/loylex-bridge-token
      LOYLEX_DATABASE_PATH: /data/loylex.sqlite
      LOYLEX_AUDIT_PATH: /audit/inbound.ndjson
      LOYLEX_CONTEXT_MESSAGES: "80"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,nodev,nosuid,noexec,size=128m
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 256
    pull_policy: missing
    restart: always
    healthcheck:
      test:
        - CMD
        - bun
        - /app/src/gateway/health.ts
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  agent-blue:
    profiles:
      - blue
    image: ghcr.io/chelokot/loylex-agent@sha256:44dcccd3ff9fdb32e9a731efffc34ffacbe905ca2b995337986a663ae8ef846f
    container_name: loylex-agent-blue
    networks:
      - loylex
    volumes:
      - agent-home:/home/loylex:Z,U
      - memory:/memory:Z,U
      - workspace:/workspace:Z,U
    secrets:
      - loylex-bridge-token
      - loylex-supervisor-token
    read_only: true
    tmpfs:
      - /tmp:rw,nodev,nosuid,noexec,size=256m
    environment:
      LOYLEX_BRIDGE_TOKEN_FILE: /run/secrets/loylex-bridge-token
      LOYLEX_BRIDGE_URL: http://loylex-gateway:8787
      LOYLEX_SUPERVISOR_URL: http://host.containers.internal:8790
      LOYLEX_SUPERVISOR_TOKEN_FILE: /run/secrets/loylex-supervisor-token
      LOYLEX_WORKER_SLOT: blue
      CODEX_MODEL: gpt-5.6-luna
      CODEX_REASONING_EFFORT: max
      LOYLEX_MAX_CONCURRENT_JOBS: "50"
    cpus: 5.5
    mem_limit: 9g
    memswap_limit: 13g
    pids_limit: 4096
    pull_policy: missing
    restart: on-failure
    healthcheck:
      test:
        - CMD
        - /usr/bin/test
        - -s
        - /tmp/loylex-worker-ready
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 300s

  agent-green:
    profiles:
      - green
    image: ghcr.io/chelokot/loylex-agent@sha256:44dcccd3ff9fdb32e9a731efffc34ffacbe905ca2b995337986a663ae8ef846f
    container_name: loylex-agent-green
    networks:
      - loylex
    volumes:
      - agent-home:/home/loylex:Z,U
      - memory:/memory:Z,U
      - workspace:/workspace:Z,U
    secrets:
      - loylex-bridge-token
      - loylex-supervisor-token
    read_only: true
    tmpfs:
      - /tmp:rw,nodev,nosuid,noexec,size=256m
    environment:
      LOYLEX_BRIDGE_TOKEN_FILE: /run/secrets/loylex-bridge-token
      LOYLEX_BRIDGE_URL: http://loylex-gateway:8787
      LOYLEX_SUPERVISOR_URL: http://host.containers.internal:8790
      LOYLEX_SUPERVISOR_TOKEN_FILE: /run/secrets/loylex-supervisor-token
      LOYLEX_WORKER_SLOT: green
      CODEX_MODEL: gpt-5.6-luna
      CODEX_REASONING_EFFORT: max
      LOYLEX_MAX_CONCURRENT_JOBS: "50"
    cpus: 5.5
    mem_limit: 9g
    memswap_limit: 13g
    pids_limit: 4096
    pull_policy: missing
    restart: on-failure
    healthcheck:
      test:
        - CMD
        - /usr/bin/test
        - -s
        - /tmp/loylex-worker-ready
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 300s

volumes:
  gateway-data:
    name: loylex-gateway-data
    external: true
  audit-data:
    name: loylex-audit
    external: true
  agent-home:
    name: loylex-agent-home
    external: true
  memory:
    name: loylex-memory
    external: true
  workspace:
    name: loylex-workspace
    external: true

networks:
  loylex:
    name: loylex
    external: true

secrets:
  loylex-telegram-token:
    external: true
  loylex-bridge-token:
    external: true
  loylex-supervisor-token:
    external: true
