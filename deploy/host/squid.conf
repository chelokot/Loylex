# Egress proxy for the Claude Code process in the agent container only.
# Anthropic domains go through the operator's home machines over Tailscale
# (desktop first, then laptop) and fall back to direct; everything else is direct.
# Containers reach it at host.containers.internal:3128 and arrive from the host's
# public address; firewalld keeps the port closed to the outside.

http_port 3128

acl anthropic dstdomain .anthropic.com .claude.ai .claude.com
acl CONNECT method CONNECT
acl https port 443
acl loylex_containers src 178.18.255.214

cache_peer 100.86.173.1 parent 3128 0 no-query no-digest connect-timeout=3 connect-fail-limit=2 name=fedora-pc-odesa
cache_peer 100.66.51.65 parent 3128 0 no-query no-digest connect-timeout=3 connect-fail-limit=2 name=fedora-laptop-brasov
cache_peer_access fedora-pc-odesa allow anthropic
cache_peer_access fedora-laptop-brasov allow anthropic
always_direct allow !anthropic
nonhierarchical_direct off
prefer_direct off

http_access deny CONNECT !https
http_access allow localhost
http_access allow loylex_containers
http_access deny all

cache deny all
